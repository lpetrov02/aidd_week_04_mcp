name: aidd-mcp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - nodejs>=20              # npm, npx (MCP Inspector) и Qwen Code
  - uv                      # uvx для запуска сторонних MCP-серверов
  - pip
  - pip:
      - flask>=3.0            # TODO-приложение
      - mcp>=2.2,<3           # MCP-сервер и его тесты (SDK 2.x)
      - openpyxl>=3.1         # сборка .xlsx в skill make_report (задание 1)
      - excel-mcp-server>=2.2 # готовый MCP-сервер для Excel
